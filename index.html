<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ChatMy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8e8;
         height: 100dvh; display: flex; flex-direction: column; align-items: center; }
  #chat { width: 100%; max-width: 720px; flex: 1; overflow-y: auto; padding: 20px 16px;
          display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
         white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #3b6cf6; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #1d2129; border-bottom-left-radius: 4px; }
  .typing { opacity: .6; font-style: italic; }
  #bar { width: 100%; max-width: 720px; display: flex; gap: 8px; padding: 12px 16px 20px; }
  input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a2f3a;
          background: #1d2129; color: inherit; font-size: 16px; outline: none; }
  input:focus { border-color: #3b6cf6; }
  button { padding: 0 20px; border: 0; border-radius: 12px; background: #3b6cf6; color: #fff;
           font-size: 16px; cursor: pointer; min-height: 44px; }
  button:disabled { opacity: .5; cursor: default; }

  #login { position: fixed; inset: 0; background: #0f1115; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 12px; padding: 20px; z-index: 10; }
  #login form { display: flex; gap: 8px; width: 100%; max-width: 360px; }
  #login p { margin: 0; color: #f66; min-height: 1.2em; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="login">
    <h2 style="margin:0">🔒 Acesso privado</h2>
    <form id="loginForm">
      <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
    <p id="loginErr"></p>
  </div>

  <div id="chat"></div>
  <div id="bar">
    <input id="input" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="send">Enviar</button>
  </div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const login = document.getElementById("login");
  const loginErr = document.getElementById("loginErr");
  const history = [];

  // A senha fica salva só neste aparelho, assim você não digita toda vez
  let password = localStorage.getItem("chat_pass") || "";
  if (password) login.classList.add("hidden");

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    password = document.getElementById("pass").value;
    if (!password) return;
    localStorage.setItem("chat_pass", password);
    loginErr.textContent = "";
    login.classList.add("hidden");
    input.focus();
  });

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;

    addMsg(text, "user");
    history.push({ role: "user", content: text });
    const typing = addMsg("digitando...", "bot typing");

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-password": password },
        body: JSON.stringify({ messages: history }),
      });
      const data = await r.json();

      if (r.status === 401) {
        // senha errada: volta pra tela de login
        typing.remove();
        history.pop();
        localStorage.removeItem("chat_pass");
        document.getElementById("pass").value = "";
        loginErr.textContent = "Senha incorreta.";
        login.classList.remove("hidden");
        sendBtn.disabled = false;
        return;
      }

      typing.remove();
      if (!r.ok) throw new Error(data.error || "Erro");
      addMsg(data.reply, "bot");
      history.push({ role: "assistant", content: data.reply });
    } catch (e) {
      typing.textContent = "Ops, deu erro. Tenta de novo.";
    }
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  addMsg("Oi! Como posso ajudar?", "bot");
</script>
</body>
</html>
